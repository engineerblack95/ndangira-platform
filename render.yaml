databases:
  - name: ndangira-db
    databaseName: ndangira
    plan: free
    region: frankfurt
    postgresMajorVersion: "15"

services:
  # ---------- Backend (Express) ----------
  - type: web
    name: ndangira-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ndangira-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://ndangira-client.onrender.com
      - key: NODE_ENV
        value: production

  # ---------- Frontend (React + Vite) ----------
  - type: web
    name: ndangira-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ndangira-server
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html